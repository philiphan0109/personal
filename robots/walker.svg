<svg viewBox="0 0 56 82" xmlns="http://www.w3.org/2000/svg">
  <style>
    .arm,
    .leg {
      transform-box: fill-box;
      transform-origin: center top;
    }

    .leg-left,
    .arm-right {
      animation: swing-forward 0.5s ease-in-out infinite;
    }

    .leg-right,
    .arm-left {
      animation: swing-back 0.5s ease-in-out infinite;
    }

    @keyframes swing-forward {
      0%, 100% { transform: rotate(22deg); }
      50% { transform: rotate(-22deg); }
    }

    @keyframes swing-back {
      0%, 100% { transform: rotate(-22deg); }
      50% { transform: rotate(22deg); }
    }
  </style>

  <g class="arm arm-left">
    <rect x="9" y="32" width="4.5" height="18" rx="2.25" fill="#46345f"></rect>
  </g>
  <g class="arm arm-right">
    <rect x="42.5" y="32" width="4.5" height="18" rx="2.25" fill="#46345f"></rect>
  </g>

  <g class="leg leg-left">
    <rect x="19" y="54" width="6" height="20" rx="3" fill="#46345f"></rect>
  </g>
  <g class="leg leg-right">
    <rect x="31" y="54" width="6" height="20" rx="3" fill="#46345f"></rect>
  </g>

  <line x1="28" y1="10" x2="28" y2="4" stroke="#71549a" stroke-width="2" stroke-linecap="round"></line>
  <circle cx="28" cy="3" r="2.5" fill="#71549a"></circle>
  <rect x="15" y="9" width="26" height="19" rx="5" fill="#71549a"></rect>
  <circle cx="22" cy="18.5" r="2.6" fill="#f4f1ea"></circle>
  <circle cx="34" cy="18.5" r="2.6" fill="#f4f1ea"></circle>
  <rect x="13" y="29" width="30" height="27" rx="5" fill="#71549a"></rect>
  <rect x="20" y="36" width="16" height="6" rx="3" fill="#46345f" opacity="0.55"></rect>
</svg>
