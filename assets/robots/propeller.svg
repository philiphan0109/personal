<svg viewBox="0 -12 70 84" xmlns="http://www.w3.org/2000/svg">
  <style>
    .arm,
    .top-propeller {
      transform-box: fill-box;
    }

    .arm {
      transform-origin: center top;
    }

    .arm-left {
      animation: sway-back 0.8s ease-in-out infinite;
    }

    .arm-right {
      animation: sway-forward 0.8s ease-in-out infinite;
    }

    .propeller-blade {
      transform-origin: center;
      animation: propeller-spin 0.28s ease-in-out infinite alternate;
    }

    @keyframes sway-forward {
      0%, 100% { transform: rotate(8deg); }
      50% { transform: rotate(-8deg); }
    }

    @keyframes sway-back {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
    }

    @keyframes propeller-spin {
      from {
        transform: scaleX(1);
        opacity: 1;
      }

      to {
        transform: scaleX(0.16);
        opacity: 0.62;
      }
    }
  </style>

  <line x1="35" y1="19" x2="35" y2="8" stroke="#71549a" stroke-width="2.5" stroke-linecap="round"></line>
  <rect class="propeller-blade" x="12" y="5" width="46" height="4" rx="2" fill="#46345f"></rect>
  <circle cx="35" cy="7" r="3" fill="#71549a"></circle>

  <g class="arm arm-left">
    <rect x="16" y="41" width="4.5" height="18" rx="2.25" fill="#46345f"></rect>
  </g>
  <g class="arm arm-right">
    <rect x="49.5" y="41" width="4.5" height="18" rx="2.25" fill="#46345f"></rect>
  </g>

  <rect x="22" y="18" width="26" height="19" rx="5" fill="#71549a"></rect>
  <circle cx="29" cy="27.5" r="2.6" fill="#f4f1ea"></circle>
  <circle cx="41" cy="27.5" r="2.6" fill="#f4f1ea"></circle>
  <rect x="20" y="38" width="30" height="27" rx="5" fill="#71549a"></rect>
  <rect x="27" y="45" width="16" height="6" rx="3" fill="#46345f" opacity="0.55"></rect>
</svg>
