<svg viewBox="0 0 56 82" xmlns="http://www.w3.org/2000/svg">
  <style>
    .arm,
    .wheel {
      transform-box: fill-box;
    }

    .arm {
      transform-origin: center top;
    }

    .arm-left {
      animation: sway-back 0.8s ease-in-out infinite;
    }

    .arm-right {
      animation: sway-forward 0.8s ease-in-out infinite;
    }

    .wheel {
      transform-origin: center;
      animation: wheel-turn 0.8s linear infinite;
    }

    @keyframes sway-forward {
      0%, 100% { transform: rotate(8deg); }
      50% { transform: rotate(-8deg); }
    }

    @keyframes sway-back {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
    }

    @keyframes wheel-turn {
      to { transform: rotate(360deg); }
    }
  </style>

  <g class="arm arm-left">
    <rect x="9" y="32" width="4.5" height="18" rx="2.25" fill="#46345f"></rect>
  </g>
  <g class="arm arm-right">
    <rect x="42.5" y="32" width="4.5" height="18" rx="2.25" fill="#46345f"></rect>
  </g>

  <path d="M22 9a6 6 0 0 1 12 0Z" fill="#71549a"></path>
  <circle cx="28" cy="6" r="2" fill="#f4f1ea"></circle>
  <rect x="15" y="9" width="26" height="19" rx="5" fill="#71549a"></rect>
  <circle cx="22" cy="18.5" r="2.6" fill="#f4f1ea"></circle>
  <circle cx="34" cy="18.5" r="2.6" fill="#f4f1ea"></circle>
  <rect x="13" y="29" width="30" height="27" rx="5" fill="#71549a"></rect>
  <rect x="20" y="36" width="16" height="6" rx="3" fill="#46345f" opacity="0.55"></rect>

  <rect x="7" y="57" width="42" height="18" rx="9" fill="#46345f"></rect>
  <rect x="10" y="60" width="36" height="12" rx="6" fill="#71549a"></rect>
  <g class="wheel">
    <circle cx="16" cy="66" r="4" fill="#f4f1ea"></circle>
    <rect x="15" y="62" width="2" height="8" rx="1" fill="#46345f"></rect>
  </g>
  <g class="wheel">
    <circle cx="28" cy="66" r="4" fill="#f4f1ea"></circle>
    <rect x="27" y="62" width="2" height="8" rx="1" fill="#46345f"></rect>
  </g>
  <g class="wheel">
    <circle cx="40" cy="66" r="4" fill="#f4f1ea"></circle>
    <rect x="39" y="62" width="2" height="8" rx="1" fill="#46345f"></rect>
  </g>
</svg>
